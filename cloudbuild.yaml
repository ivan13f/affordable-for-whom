options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/affordable-to-whom-img:$SHORT_SHA',
        '.'
      ]

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/affordable-to-whom-img:$SHORT_SHA'
      ]

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'affordable-to-whom-app',
        '--image', 'gcr.io/$PROJECT_ID/affordable-to-whom-img:$SHORT_SHA',
        '--platform', 'managed',
        '--region', 'europe-west3',
        '--allow-unauthenticated',
        '--port', '8501',
        '--memory', '256Mi',
        '--cpu', '1',
        '--max-instances', '1',
        '--min-instances', '0',
        '--cpu-throttling'
      ]

images:
  - 'gcr.io/$PROJECT_ID/affordable-to-whom-img:$SHORT_SHA'